name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: MiniwallCore (swift test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/fetch-spec.sh
      - run: swift --version
      - name: swift test
        run: |
          set -o pipefail
          if ! swift test 2>&1 | tee swift-test.log; then
            # Surface the first compiler / test errors as annotations (job logs are long).
            grep -E "error:|failed|Fatal error" swift-test.log | head -15 | while IFS= read -r line; do echo "::error::${line:0:400}"; done
            exit 1
          fi

  example:
    name: sample app builds
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/fetch-spec.sh
      - run: brew install xcodegen
      - run: cd Example && xcodegen generate
      - run: xcodebuild build -project Example/MiniwallExample.xcodeproj -scheme MiniwallExample -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
