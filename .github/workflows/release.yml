name: Release

# Swift Package Manager needs nothing but the tag itself. This workflow checks the tag and, when enabled, pushes
# MiniwallCore and MiniwallSDK to CocoaPods Trunk (Core first, SDK depends on it). Nothing is published until the owner
# creates the `publish` environment with required reviewers, adds COCOAPODS_TRUNK_TOKEN as a repository secret and sets the repository
# variable PUBLISH_ENABLED=true.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  guard:
    name: tag checks
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.g.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: g
        env:
          TAG: ${{ github.ref_name }}
          ENABLED: ${{ vars.PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag $TAG is not on main"; exit 1; }
          for f in MiniwallCore.podspec MiniwallSDK.podspec; do
            v=$(sed -n "s/^  s.version *= *'\(.*\)'/\1/p" "$f")
            [ "$v" = "$TAG" ] || { echo "::error::tag $TAG does not match $f ($v)"; exit 1; }
          done
          grep -q "public static let version = \"$TAG\"" Sources/MiniwallSDK/Miniwall.swift || { echo "::error::Miniwall.version in Sources/MiniwallSDK/Miniwall.swift is not $TAG (it is sent as X-Miniwall-SDK)"; exit 1; }
          grep -qE "^## ${TAG//./\\.}( |$)" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $TAG' section"; exit 1; }
          echo "enabled=${ENABLED:-false}" >> "$GITHUB_OUTPUT"

  publish:
    name: push to CocoaPods Trunk
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: macos-latest
    environment: publish
    steps:
      - uses: actions/checkout@v4
      - run: scripts/fetch-spec.sh
      - run: swift test
      # Core goes first and SDK depends on it: after pushing Core, wait until the Trunk API serves it before linting SDK.
      # A pod whose version already exists is skipped, so a rerun after a partial failure finishes the job.
      - name: lint and push
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          on_trunk() { curl -fsS -o /dev/null "https://trunk.cocoapods.org/api/v1/pods/$1/specs/$TAG"; }
          for pod in MiniwallCore MiniwallSDK; do
            if on_trunk "$pod"; then echo "$pod $TAG is already on Trunk, skipping"; continue; fi
            if [ "$pod" = MiniwallSDK ]; then
              for i in $(seq 1 30); do on_trunk MiniwallCore && break; echo "waiting for MiniwallCore $TAG on Trunk ($i/30)"; sleep 30; done
              on_trunk MiniwallCore || { echo "::error::MiniwallCore $TAG never appeared on Trunk"; exit 1; }
            fi
            pod spec lint "$pod.podspec" --allow-warnings
            pod trunk push "$pod.podspec" --allow-warnings
          done

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
